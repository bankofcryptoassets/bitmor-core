# Fast development profile (default) - NO model checker
[profile.default]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 200
sizes = true
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "./out" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "../lending-pool" }
]
cbor_metadata = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
dynamic_test_linking = true

[etherscan]
base_sepolia = { key = "${ETHERSCAN_KEY}", chain = 84532 }

# Security analysis profile - WITH model checker (use: FOUNDRY_PROFILE=security forge build)
[profile.security]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 200

[profile.security.model_checker]
contracts = {}  # For specific contracts: { "src/Contract.sol" = ["Contract"] }
engine = 'chc'
timeout = 30000  # Increased timeout
targets = ['assert', 'underflow', 'overflow', 'divByZero']

# Compiler optimizations for mixed version setup
auto_detect_solc = true  # Let Foundry handle version selection
solc_version = "0.8.30"  # Default version, overridden per file as needed

# Fast local development profile - reduced optimizer runs for speed
[profile.local]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
optimizer = true
optimizer_runs = 200      # Minimal optimization for faster compilation
sizes = false           # Skip size reporting for speed
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "./out" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "../lending-pool" }
]
cbor_metadata = true
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
dynamic_test_linking = true

# Unit test profile - local Anvil with mocks
[profile.unit]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test/unit"
optimizer = true
optimizer_runs = 1
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]
dynamic_test_linking = true
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "./out" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "../lending-pool" }
]

# Fork test profile - Base Sepolia fork with fresh Bitmor
[profile.fork]
src = "src"
out = "out"
libs = ["node_modules", "lib"]
test = "test/fork"
optimizer = true
optimizer_runs = 200
ffi = true
fork_url = "${BASE_SEPOLIA_RPC_URL}"
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "../lending-pool" }
]

