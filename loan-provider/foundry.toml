# Coverage profile - excludes scripts to avoid stack depth issues
[profile.coverage]
src = "src"
out = "out"
test = "test/unit"
script = ".coverage-disabled"  # Non-existent path to exclude scripts
libs = ["node_modules", "lib"]
optimizer = false  # Coverage needs optimizer disabled for accurate reports
via_ir = false
ffi = true
dynamic_test_linking = true
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
    { access = "read", path = "../lending-pool" }
]

# Fork deployment (Anvil forking Base mainnet, no mocks)
[profile.fork-deploy]
src = "src"
optimizer = true
optimizer_runs = 200
ffi = true
fs_permissions = [
    { access = "read", path = "./out/" },
    { access = "read", path = "./broadcast/" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read", path = "../deployments" },
]

# Testnet deployment profile (Base Sepolia with full mocks)
[profile.testnet]
src = "src"
out = "out"
