# Fuzz test profile
[profile.fuzz]
src = "src"
out = "forge-out"
libs = ["node_modules", "lib"]
test = "test/fuzz"
optimizer = true
optimizer_runs = 1
via_ir = true
ffi = true
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read", path = "./reports" },
    { access = "read", path = "../lending-pool/deployed-contracts.json" },
    { access = "read-write", path = "./deployments.json" }
]

[profile.fuzz.fuzz]
runs = 1000
