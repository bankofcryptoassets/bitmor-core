name: CI

on:
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            loan-provider/forge-out
            loan-provider/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('loan-provider/foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Build loan-provider (Forge)
        working-directory: loan-provider
        run: forge build

      - name: Setup Node.js
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lending-pool/package-lock.json

      - name: Install lending-pool dependencies
        if: ${{ !env.ACT }}
        working-directory: lending-pool
        run: npm ci

      - name: Build lending-pool (Hardhat)
        if: ${{ !env.ACT }}
        working-directory: lending-pool
        run: npm run compile

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            loan-provider/forge-out
            loan-provider/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('loan-provider/foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Check loan-provider formatting (Forge)
        working-directory: loan-provider
        run: forge fmt --check

  unit-tests:
    name: Unit Tests (loan-provider)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            loan-provider/forge-out
            loan-provider/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('loan-provider/foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Run unit tests
        working-directory: loan-provider
        env:
          FOUNDRY_PROFILE: unit
        run: forge test -v

  lp-tests:
    name: Lending Pool Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        if: ${{ !env.ACT }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lending-pool/package-lock.json

      - name: Install lending-pool dependencies
        if: ${{ !env.ACT }}
        working-directory: lending-pool
        run: npm ci

      - name: Run lending-pool tests
        if: ${{ !env.ACT }}
        working-directory: lending-pool
        run: npm test

  fuzz-tests:
    name: Fuzz Tests (loan-provider)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: ${{ github.base_ref != 'main' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            loan-provider/forge-out
            loan-provider/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('loan-provider/foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Run fuzz tests
        working-directory: loan-provider
        env:
          FOUNDRY_PROFILE: fuzz
        run: forge test -v

  invariant-tests:
    name: Invariant Tests (loan-provider)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: ${{ github.base_ref != 'main' }}
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Cache Foundry artifacts
        if: ${{ !env.ACT }}
        uses: actions/cache@v4
        with:
          path: |
            loan-provider/forge-out
            loan-provider/cache
          key: foundry-${{ runner.os }}-${{ hashFiles('loan-provider/foundry.lock') }}
          restore-keys: |
            foundry-${{ runner.os }}-

      - name: Run invariant tests
        working-directory: loan-provider
        env:
          FOUNDRY_PROFILE: invariant
        run: forge test -v
