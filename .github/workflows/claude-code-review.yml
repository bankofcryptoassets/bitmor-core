name: Claude Code Review

on:
    pull_request:
        types: [opened, synchronize]
        paths:
            - "loan-provider/src/**/*.sol"
            - "loan-provider/test/**/*.sol"

jobs:
    claude-review:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
            issues: read
            id-token: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 1

            - name: Run Claude Code Review
              id: claude-review
              uses: anthropics/claude-code-action@v1
              with:
                  claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                  prompt: |
                      REPO: ${{ github.repository }}
                      PR NUMBER: ${{ github.event.pull_request.number }}

                      You are reviewing a Bitmor Protocol PR. Use the skills in
                      .claude/skills/ for domain context:
                      - solidity-review: Security vulnerability patterns
                      - foundry-testing: Test coverage analysis
                      - natspec-standards: Documentation requirements

                      Review this PR comprehensively:

                      ## Security Review
                      - Reentrancy vulnerabilities
                      - Access control issues
                      - Flash loan attack vectors
                      - Integer overflow/underflow

                      ## Code Style
                      - NatSpec documentation completeness
                      - Error handling with custom errors
                      - Event emissions for state changes

                      ## Test Coverage
                      - Loan lifecycle coverage (initialize, repay, close)
                      - Edge cases and failure scenarios
                      - Fork testing configuration

                      Reference CLAUDE.md for architecture details.
                      Use `gh pr comment` to post your review.

                  claude_args: >-
                      --allowed-tools "Read,Grep,Glob,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),mcp__github__*"
                      --append-system-prompt "You are a senior Solidity auditor. Focus on security vulnerabilities, NatSpec documentation standards, and comprehensive test coverage. Reference the .claude/skills/ for detailed guidelines."

                  mcp_config: |
                      {
                        "mcpServers": {
                          "github": {
                            "command": "npx",
                            "args": ["-y", "@modelcontextprotocol/server-github"],
                            "env": {
                              "GITHUB_PERSONAL_ACCESS_TOKEN": "${{ secrets.GITHUB_TOKEN }}"
                            }
                          }
                        }
                      }
