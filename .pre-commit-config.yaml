repos:
    - repo: local
      hooks:
          - id: forge-fmt
            name: Forge format check
            entry: bash -c 'cd loan-provider && forge fmt --check'
            language: system
            types: [solidity]
            pass_filenames: false

          - id: forge-test
            name: Forge build and test
            entry: bash -c 'cd loan-provider && forge clean && make test'
            language: system
            types: [solidity]
            pass_filenames: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v4.4.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
            args: ["--maxkb=1000"]
          - id: check-merge-conflict
