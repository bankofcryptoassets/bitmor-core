# Default profile
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
solc_version = "0.8.30"
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read-write", path = "./deployments.json" }
]
ffi = true
remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "@uniswap/v4-periphery/=lib/v4-periphery/",
    "@uniswap/universal-router/=lib/universal-router/",
    "@uniswap/permit2/=lib/v4-periphery/lib/permit2/",
    "@openzeppelin/contracts/=lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/v4-core/lib/forge-std/src/",
    "v4-core/=lib/v4-core/src/",
    "v4-periphery/=lib/v4-periphery/src/"
]

[etherscan]
base_sepolia = { key = "${ETHERSCAN_KEY}", chain = 84532 }
base = { key = "${ETHERSCAN_KEY}", chain = 8453 }

# Local development profile (faster compilation)
[profile.local]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1
via_ir = true
fs_permissions = [
    { access = "read", path = "./broadcast" },
    { access = "read-write", path = "./deployments.json" }
]
ffi = true

# Network configurations
[rpc_endpoints]
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
