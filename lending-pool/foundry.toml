[profile.default]
src = "contracts"
out = "out-foundry"
test = "test-foundry"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
evm_version = "istanbul"
auto_detect_solidity = true
fs_permissions = [{ access = "read", path = "out-foundry" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "hardhat/=node_modules/hardhat/",
]

[profile.default.fuzz]
runs = 256
max_test_rejects = 65536

[profile.deep]
fuzz = { runs = 10000 }
